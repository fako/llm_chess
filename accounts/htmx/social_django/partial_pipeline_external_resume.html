{% extends "base.htmx" %}
{% block title %}{{ _("accounts.confirm_email.title") }} · {{ _("site.name") }}{% endblock %}
{% block content %}
  <form method="post" action="{{ action_url }}" class="card space-y-4 p-5">
    {{ csrf_input }}
    <input type="hidden" name="{{ confirmation_parameter }}" value="{{ confirmation_value }}">
    <input type="hidden" name="{{ confirmation_nonce_parameter }}" value="{{ confirmation_nonce }}">
    <div>
      <h1 class="font-serif text-3xl">{{ _("accounts.confirm_email.heading") }}</h1>
      <p class="mt-1 text-muted">{{ _("accounts.confirm_email.intro") }}</p>
    </div>
    <button type="submit" class="btn-primary w-full">{{ _("accounts.confirm_email.submit") }}</button>
  </form>
{% endblock %}
